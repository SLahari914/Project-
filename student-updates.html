
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Weekly Updates</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1e3a8a;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

header h2 {
    font-size: 21px;
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.back-btn {
    background: white;
    color: #1e3a8a;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 12px #0000000d;
}

h3 {
    margin-bottom: 20px;
    color: #1e3a8a;
}

label {
    display: block;
    margin: 14px 0 7px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

.submit-btn {
    background: #2563eb;
    color: white;
    margin-top: 18px;
}

.submit-btn:hover {
    background: #1d4ed8;
}

.update {
    border: 1px solid #e2e8f0;
    padding: 15px;
    margin-top: 12px;
    border-radius: 8px;
}

.update p {
    margin: 7px 0;
    overflow-wrap: anywhere;
}

.status {
    font-weight: bold;
    color: #166534;
}

.empty {
    color: #64748b;
}

.message {
    margin-top: 12px;
    color: #166534;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h2>Student Weekly Updates</h2>
    <button class="back-btn" onclick="goBack()">Back to Dashboard</button>
</header>

<div class="container">

    <div class="card">
        <h3>Submit Weekly Internship Work</h3>

        <form id="updateForm">
            <label for="date">Week Ending Date</label>
            <input type="date" id="date" required>

            <label for="description">Weekly Work Description</label>
            <textarea id="description"
                placeholder="Describe the work you completed this week..."
                required></textarea>

            <label for="hours">Hours Worked (This Week)</label>
            <input type="number" id="hours" min="0.5" max="100"
                step="0.5" placeholder="Example: 35" required>

            <label for="status">Work Status</label>
            <select id="status" required>
                <option value="">Select status</option>
                <option value="Completed">Completed</option>
                <option value="In Progress">In Progress</option>
                <option value="Pending">Pending</option>
            </select>

            <label for="remarks">Remarks / Challenges (Optional)</label>
            <textarea id="remarks"
                placeholder="Any challenges faced or additional remarks..."></textarea>

            <label for="documentFile">Upload Weekly Report (Document or PDF)</label>
            <input type="file" id="documentFile"
                accept=".pdf,.doc,.docx,.txt,.rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
            <small style="color: #64748b; display: block; margin-top: 5px; font-size: 13px;">
                Upload either a PDF (.pdf) or Document (.doc, .docx) file containing your weekly report.
            </small>

            <button type="submit" class="submit-btn">Submit Weekly Update</button>
            <p id="message" class="message"></p>
        </form>
    </div>

    <div class="card">
        <h3>My Submitted Weekly Updates</h3>
        <div id="updatesList"></div>
    </div>

</div>

<!-- In-Dashboard Document & PDF Viewer Modal -->
<div id="docViewerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:10000; padding:15px; box-sizing:border-box;">
    <div style="background:white; width:95%; max-width:1100px; height:90vh; border-radius:12px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.35);">
        <!-- Modal Header -->
        <div style="background:#1e3a8a; color:white; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-shrink:0;">
            <div style="display:flex; align-items:center; gap:10px; overflow:hidden;">
                <span style="font-size:24px;">📄</span>
                <div>
                    <h3 id="docModalTitle" style="margin:0; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:white;">Document Viewer</h3>
                    <small id="docModalSub" style="color:#bfdbfe; font-size:12px;">Submitted Weekly Report</small>
                </div>
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-shrink:0;">
                <a id="docModalDirectLink" href="#" target="_blank" style="background:#2563eb; color:white; padding:7px 14px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:12.5px; display:inline-flex; align-items:center; gap:5px;">
                    🔗 Open in New Tab
                </a>
                <a id="docModalDownloadLink" href="#" download style="background:#0284c7; color:white; padding:7px 14px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:12.5px; display:inline-flex; align-items:center; gap:5px;">
                    ⬇️ Download
                </a>
                <button type="button" onclick="closeDocViewerModal()" style="background:#ef4444; color:white; border:none; padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:13px;">
                    ✕ Close
                </button>
            </div>
        </div>

        <!-- Modal Body / Content Viewer -->
        <div id="docModalContent" style="flex:1; background:#f8fafc; padding:0; overflow:hidden; display:flex; justify-content:center; align-items:center; position:relative;">
            <!-- Dynamic Iframe for PDF or preview container -->
        </div>

        <!-- Modal Footer -->
        <div style="background:#f1f5f9; padding:12px 20px; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; flex-shrink:0;">
            <div id="docModalStatusInfo" style="font-size:13px; font-weight:600; color:#334155;"></div>
            <button type="button" onclick="closeDocViewerModal()" style="background:#64748b; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">Close Preview</button>
        </div>
    </div>
</div>

<script>
const role = localStorage.getItem("userRole");
const usn = localStorage.getItem("username");

if (role !== "student" || !usn) {
    window.location.href = "/login";
}

document.getElementById("date").value =
    new Date().toLocaleDateString("en-CA");

function getLocalUpdates() {
    try {
        const weekly = JSON.parse(localStorage.getItem("weeklyUpdates") || "[]");
        const daily  = JSON.parse(localStorage.getItem("dailyUpdates")  || "[]");
        const map = new Map();
        [...weekly, ...daily].forEach(u => {
            if (u && (u.date || u.description)) {
                const key = (u.date || "") + "|" + (u.description || "");
                if (!map.has(key)) map.set(key, u);
            }
        });
        return Array.from(map.values());
    } catch {
        return [];
    }
}

async function displayUpdates() {
    const list = document.getElementById("updatesList");

    let serverUpdates = [];
    try {
        const res = await fetch("/api/updates?student=" + encodeURIComponent(usn));
        if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
                serverUpdates = data.map(u => ({
                    id: u.id,
                    usn: u.student_usn || usn,
                    date: u.date || "",
                    description: u.description || "",
                    hours: u.work_done || "-",
                    status: u.status || "Pending",
                    remarks: u.challenges || "",
                    document_path: u.document_path || "",
                    document_name: u.document_name || "",
                    staff_remarks: u.staff_remarks || "",
                    approved_by: u.approved_by || "",
                    submittedAt: u.submitted_on || ""
                }));
            }
        }
    } catch (e) {
        console.warn("Could not fetch remote updates:", e);
    }

    const localList = getLocalUpdates().filter(u => u.usn === usn);

    // Merge server and local updates uniquely
    const seen = new Set();
    const merged = [];
    [...serverUpdates, ...localList].forEach(item => {
        const key = (item.date || "") + "::" + (item.description || "").slice(0, 30);
        if (!seen.has(key)) {
            seen.add(key);
            merged.push(item);
        }
    });

    merged.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

    if (merged.length === 0) {
        list.innerHTML = '<p class="empty">You have not submitted any weekly updates yet.</p>';
        return;
    }

    list.replaceChildren();

    merged.forEach(update => {
        const article = document.createElement("article");
        article.className = "update";

        const title = document.createElement("h4");
        title.style.color = "#1e3a8a";
        title.textContent = "Week Date: " + (update.date || "N/A");

        const description = document.createElement("p");
        description.innerHTML = "<b>Weekly Work:</b> " + (update.description || "-");

        const hours = document.createElement("p");
        hours.innerHTML = "<b>Hours / Status:</b> " + (update.hours || "-");

        const status = document.createElement("p");
        const isApproved = (update.status || "").toLowerCase() === "approved";
        const badgeColor = isApproved ? "#dcfce7" : "#fef3c7";
        const textColor = isApproved ? "#15803d" : "#b45309";
        const icon = isApproved ? "✓ " : "⏳ ";
        status.innerHTML = `<b>Approval Status:</b> <span style="background:${badgeColor}; color:${textColor}; padding:4px 10px; border-radius:12px; font-weight:bold; font-size:12.5px;">${icon}${update.status || "Pending"}</span>`;

        const remarks = document.createElement("p");
        remarks.innerHTML = "<b>Remarks / Challenges:</b> " + (update.remarks || "None");

        article.append(title, description, hours, status, remarks);

        // Attached document / PDF link
        if (update.document_path) {
            const docP = document.createElement("p");
            const cleanDocName = update.document_name || "Weekly Report (PDF / Document)";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "doc-btn";
            btn.style.cssText = "display:inline-flex; align-items:center; gap:6px; background:#e0f2fe; color:#0369a1; padding:6px 14px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:13px; margin-left:6px; border:1px solid #bae6fd; cursor:pointer;";
            btn.innerHTML = `📄 View ${cleanDocName}`;
            btn.onclick = () => openDocViewerModal(update.document_path, cleanDocName, update.status, update.staff_remarks);
            docP.innerHTML = "<b>Attached Document:</b> ";
            docP.appendChild(btn);
            article.appendChild(docP);
        }

        // Staff remarks / feedback
        if (update.staff_remarks) {
            const staffP = document.createElement("p");
            staffP.innerHTML = `<b>Staff Remarks:</b> <span style="color:#1d4ed8; font-weight:600;">${update.staff_remarks}</span>` + (update.approved_by ? ` <small style="color:#64748b;">(Reviewed by ${update.approved_by})</small>` : "");
            article.appendChild(staffP);
        }

        list.appendChild(article);
    });
}

document.getElementById("updateForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const date = document.getElementById("date").value;
    const description = document.getElementById("description").value.trim();
    const hours = Number(document.getElementById("hours").value);
    const status = document.getElementById("status").value;
    const remarks = document.getElementById("remarks").value.trim();
    const docFile = document.getElementById("documentFile").files[0];

    if (!date || !description || hours <= 0 || hours > 100 || !status) {
        alert("Please enter valid weekly update details (Hours between 0.5 and 100).");
        return;
    }

    const msgEl = document.getElementById("message");
    msgEl.textContent = "Submitting weekly update...";
    msgEl.style.color = "#2563eb";

    const formData = new FormData();
    formData.append("date", date);
    formData.append("description", description);
    formData.append("workDone", hours + " hrs (" + status + ")");
    formData.append("challenges", remarks);
    if (docFile) {
        formData.append("document", docFile);
    }

    try {
        const res = await fetch("/api/updates", {
            method: "POST",
            body: formData
        });
        const resData = await res.json();
        if (res.ok && resData.success) {
            msgEl.textContent = "✓ Weekly update submitted successfully with document!";
            msgEl.style.color = "#166534";
        } else {
            alert(resData.error || "Failed to submit weekly update.");
            msgEl.textContent = "";
            return;
        }
    } catch (e) {
        console.warn("Could not sync weekly update to server:", e);
        msgEl.textContent = "Weekly update saved locally (offline mode).";
        msgEl.style.color = "#b45309";
    }

    const update = {
        usn: usn,
        date: date,
        description: description,
        hours: hours,
        status: "Pending",
        remarks: remarks,
        document_name: docFile ? docFile.name : "",
        submittedAt: new Date().toISOString()
    };

    // Save locally
    try {
        const weekly = JSON.parse(localStorage.getItem("weeklyUpdates") || "[]");
        weekly.push(update);
        localStorage.setItem("weeklyUpdates", JSON.stringify(weekly));

        const daily = JSON.parse(localStorage.getItem("dailyUpdates") || "[]");
        daily.push(update);
        localStorage.setItem("dailyUpdates", JSON.stringify(daily));
    } catch (e) {
        console.error("Local storage error:", e);
    }

    document.getElementById("description").value = "";
    document.getElementById("hours").value = "";
    document.getElementById("status").value = "";
    document.getElementById("remarks").value = "";
    document.getElementById("documentFile").value = "";

    displayUpdates();
});

function openDocViewerModal(docPath, docName, status, staffRemarks) {
    if (!docPath) return;
    document.getElementById("docModalTitle").textContent = docName || "Weekly Report";
    document.getElementById("docModalSub").textContent = "Student Weekly Submission Preview";

    const directLink = document.getElementById("docModalDirectLink");
    directLink.href = docPath;

    const downloadLink = document.getElementById("docModalDownloadLink");
    downloadLink.href = docPath;
    downloadLink.setAttribute("download", docName || "weekly_report");

    const contentEl = document.getElementById("docModalContent");
    contentEl.innerHTML = "";

    const isPdf = docPath.toLowerCase().endsWith(".pdf") || (docName && docName.toLowerCase().endsWith(".pdf"));

    if (isPdf) {
        contentEl.innerHTML = `
            <div style="width:100%; height:100%; display:flex; flex-direction:column; position:relative;">
                <iframe id="pdfFrame" src="${docPath}" style="width:100%; flex:1; border:none; background:white;" title="${docName}"></iframe>
                <div style="padding:8px 15px; background:#eff6ff; border-top:1px solid #bfdbfe; font-size:12px; color:#1e40af; display:flex; justify-content:space-between; align-items:center;">
                    <span>💡 PDF preview loaded directly.</span>
                    <a href="${docPath}" target="_blank" style="color:#1d4ed8; font-weight:bold; text-decoration:underline;">Open in Full Tab</a>
                </div>
            </div>
        `;
    } else {
        contentEl.innerHTML = `
            <div style="padding:40px 20px; text-align:center; max-width:600px; margin:auto;">
                <div style="width:80px; height:80px; background:#e0f2fe; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:40px;">
                    📄
                </div>
                <h3 style="color:#1e3a8a; margin-bottom:8px; font-size:19px;">${docName}</h3>
                <div style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:15px; text-align:left; margin-bottom:25px; font-size:13.5px;">
                    <p style="margin:4px 0;"><b>Format:</b> Document File</p>
                    <p style="margin:4px 0; color:#64748b;">Word and other document formats can be opened directly or downloaded.</p>
                </div>
                <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
                    <a href="${docPath}" download="${docName}" style="background:#16a34a; color:white; padding:12px 24px; border-radius:6px; font-weight:bold; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
                        ⬇️ Download Document
                    </a>
                    <a href="${docPath}" target="_blank" style="background:#0284c7; color:white; padding:12px 20px; border-radius:6px; font-weight:bold; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
                        🔗 Open Direct Link
                    </a>
                </div>
            </div>
        `;
    }

    const statusInfo = document.getElementById("docModalStatusInfo");
    const isApproved = (status || "").toLowerCase() === "approved";
    statusInfo.innerHTML = `
        Status: <span style="padding:4px 10px; border-radius:12px; font-size:12px; font-weight:bold; ${isApproved ? 'background:#dcfce7; color:#15803d;' : 'background:#fef3c7; color:#b45309;'}">
            ${isApproved ? '✓ Approved' : '⏳ Pending Review'}
        </span>
        ${staffRemarks ? ` &bull; Staff Remarks: <span style="color:#1d4ed8;">${staffRemarks}</span>` : ''}
    `;

    document.getElementById("docViewerModal").style.display = "flex";
}

function closeDocViewerModal() {
    const modal = document.getElementById("docViewerModal");
    modal.style.display = "none";
    const contentEl = document.getElementById("docModalContent");
    if (contentEl) contentEl.innerHTML = "";
}

window.addEventListener("click", function(e) {
    const modal = document.getElementById("docViewerModal");
    if (e.target === modal) closeDocViewerModal();
});

function goBack() {
    window.location.href = "/student/dashboard";
}

displayUpdates();
</script>

</body>
</html>
